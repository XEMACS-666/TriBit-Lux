{% include head-custom-google-analytics.html %}
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1422">
<style>
  /* Dark by default, including when the visitor's system uses a light theme. */
  :root {
    color-scheme: dark;
    --lux-bg: #0b1422;
    --lux-panel: #111e31;
    --lux-alt: #16263c;
    --lux-text: #e6edf3;
    --lux-muted: #a8b8cc;
    --lux-link: #79bcff;
    --lux-border: #34465e;
  }

  html, body, .markdown-body {
    background-color: var(--lux-bg);
    color: var(--lux-text);
  }

  .markdown-body a { color: var(--lux-link); }
  .markdown-body a:hover { color: #b8dcff; }
  .markdown-body h1, .markdown-body h2 { border-color: var(--lux-border); }
  .markdown-body hr { background-color: var(--lux-border); }
  .markdown-body blockquote {
    color: var(--lux-muted);
    border-color: var(--lux-border);
  }
  .markdown-body table tr {
    background-color: var(--lux-panel);
    border-color: var(--lux-border);
  }
  .markdown-body table tr:nth-child(2n) { background-color: var(--lux-alt); }
  .markdown-body table th, .markdown-body table td { border-color: var(--lux-border); }
  .markdown-body pre, .markdown-body .highlight pre, .markdown-body .highlight,
  .markdown-body code, .markdown-body tt {
    background-color: var(--lux-panel);
    color: var(--lux-text);
  }
  .markdown-body pre code, .markdown-body pre tt { background-color: transparent; }
  .markdown-body img { background-color: transparent; }
  .markdown-body kbd {
    background-color: var(--lux-alt);
    border-color: var(--lux-border);
    color: var(--lux-text);
    box-shadow: inset 0 -1px 0 var(--lux-border);
  }
  .markdown-body .highlight .c, .markdown-body .highlight .c1,
  .markdown-body .highlight .cm, .markdown-body .highlight .cp,
  .markdown-body .highlight .cs { color: #a8b8cc; }
  .markdown-body .highlight .k, .markdown-body .highlight .kd,
  .markdown-body .highlight .kn, .markdown-body .highlight .kp,
  .markdown-body .highlight .kr, .markdown-body .highlight .kt,
  .markdown-body .highlight .o, .markdown-body .highlight .ow { color: #ff9d98; }
  .markdown-body .highlight .s, .markdown-body .highlight .s1,
  .markdown-body .highlight .s2, .markdown-body .highlight .sb,
  .markdown-body .highlight .sc, .markdown-body .highlight .sd,
  .markdown-body .highlight .se, .markdown-body .highlight .sh,
  .markdown-body .highlight .si, .markdown-body .highlight .sr,
  .markdown-body .highlight .ss { color: #b7d9ff; }
  .markdown-body .highlight .m, .markdown-body .highlight .mf,
  .markdown-body .highlight .mh, .markdown-body .highlight .mi,
  .markdown-body .highlight .mo, .markdown-body .highlight .il,
  .markdown-body .highlight .nb, .markdown-body .highlight .nc,
  .markdown-body .highlight .no, .markdown-body .highlight .nv { color: #79d5eb; }
  .markdown-body .highlight .nf, .markdown-body .highlight .na,
  .markdown-body .highlight .nt { color: #d3b0ff; }
  .markdown-body .highlight .gd { color: #ffd1ce; background-color: #421e28; }
  .markdown-body .highlight .gi { color: #b3f5c7; background-color: #123127; }
  .markdown-body .highlight .err { color: #ffd1ce; background-color: #421e28; }
  a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--lux-link);
    outline-offset: 3px;
  }
  ::selection { background-color: #284f7d; color: #fff; }
</style>
