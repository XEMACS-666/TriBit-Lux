{% include head-custom-google-analytics.html %}

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080d18">

<style>
  :root {
    color-scheme: dark;

    --lux-bg: #080d18;
    --lux-bg-soft: #0d1422;
    --lux-panel: rgba(20, 30, 48, 0.88);
    --lux-panel-strong: #141f32;
    --lux-alt: #19263b;

    --lux-text: #f4f1ea;
    --lux-text-soft: #d6d9df;
    --lux-muted: #9ba9bc;

    --lux-gold: #d8b978;
    --lux-gold-light: #f0d99c;
    --lux-link: #9dcaff;
    --lux-link-hover: #c5e0ff;

    --lux-border: rgba(216, 185, 120, 0.22);
    --lux-border-soft: rgba(255, 255, 255, 0.1);

    --lux-radius-sm: 8px;
    --lux-radius-md: 14px;
    --lux-radius-lg: 20px;

    --lux-shadow:
      0 24px 70px rgba(0, 0, 0, 0.32),
      0 4px 18px rgba(0, 0, 0, 0.18);

    --lux-shadow-soft:
      0 12px 36px rgba(0, 0, 0, 0.2);
  }

  html {
    background:
      radial-gradient(
        circle at top right,
        rgba(38, 66, 105, 0.22),
        transparent 34rem
      ),
      var(--lux-bg);

    color-scheme: dark;
  }

  body,
  .markdown-body {
    background:
      linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.018),
        transparent 40%
      ),
      var(--lux-bg);

    color: var(--lux-text);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .markdown-body {
    position: relative;
  }

  .markdown-body::before {
    content: "";
    display: block;
    width: 72px;
    height: 2px;
    margin-bottom: 2rem;
    background:
      linear-gradient(
        90deg,
        var(--lux-gold),
        rgba(216, 185, 120, 0)
      );
    border-radius: 999px;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4 {
    color: var(--lux-text);
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }

  .markdown-body h1 {
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--lux-border);
    font-size: clamp(2rem, 5vw, 3.2rem);
  }

  .markdown-body h2 {
    margin-top: 3rem;
    padding-bottom: 0.65rem;
    border-bottom: 1px solid var(--lux-border);
    font-size: clamp(1.45rem, 3vw, 2rem);
  }

  .markdown-body h3 {
    margin-top: 2rem;
    color: var(--lux-gold-light);
    font-size: 1.25rem;
  }

  .markdown-body h4 {
    color: var(--lux-text-soft);
  }

  .markdown-body p,
  .markdown-body li {
    color: var(--lux-text-soft);
  }

  .markdown-body strong,
  .markdown-body b {
    color: var(--lux-text);
    font-weight: 650;
  }

  .markdown-body em,
  .markdown-body i {
    color: var(--lux-gold-light);
  }

  .markdown-body a {
    color: var(--lux-link);
    text-decoration-color: rgba(157, 202, 255, 0.35);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition:
      color 180ms ease,
      text-decoration-color 180ms ease;
  }

  .markdown-body a:hover {
    color: var(--lux-link-hover);
    text-decoration-color: var(--lux-link-hover);
  }

  .markdown-body hr {
    height: 1px;
    margin: 2.5rem 0;
    border: 0;
    background:
      linear-gradient(
        90deg,
        transparent,
        var(--lux-border),
        transparent
      );
  }

  .markdown-body blockquote {
    margin: 1.75rem 0;
    padding: 1.2rem 1.5rem;
    color: var(--lux-muted);
    background:
      linear-gradient(
        135deg,
        rgba(216, 185, 120, 0.08),
        rgba(255, 255, 255, 0.025)
      );
    border-left: 3px solid var(--lux-gold);
    border-radius: 0 var(--lux-radius-md) var(--lux-radius-md) 0;
    box-shadow: var(--lux-shadow-soft);
  }

  .markdown-body blockquote p {
    color: var(--lux-muted);
  }

  .markdown-body ul,
  .markdown-body ol {
    color: var(--lux-text-soft);
  }

  .markdown-body li::marker {
    color: var(--lux-gold);
  }

  .markdown-body table {
    display: block;
    width: 100%;
    overflow-x: auto;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--lux-border-soft);
    border-radius: var(--lux-radius-md);
    background: var(--lux-panel);
    box-shadow: var(--lux-shadow-soft);
  }

  .markdown-body table tr {
    background-color: transparent;
    border-color: var(--lux-border-soft);
  }

  .markdown-body table tr:nth-child(2n) {
    background-color: rgba(255, 255, 255, 0.035);
  }

  .markdown-body table th,
  .markdown-body table td {
    padding: 0.85rem 1rem;
    color: var(--lux-text-soft);
    border-color: var(--lux-border-soft);
  }

  .markdown-body table th {
    color: var(--lux-gold-light);
    font-weight: 650;
    letter-spacing: 0.03em;
    background: rgba(216, 185, 120, 0.08);
  }

  .markdown-body pre,
  .markdown-body .highlight,
  .markdown-body .highlight pre {
    position: relative;
    margin: 1.75rem 0;
    overflow-x: auto;
    background:
      linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.045),
        rgba(255, 255, 255, 0.012)
      ),
      var(--lux-panel-strong);
    border: 1px solid var(--lux-border-soft);
    border-radius: var(--lux-radius-md);
    box-shadow: var(--lux-shadow);
  }

  .markdown-body pre {
    padding: 1.35rem 1.5rem;
  }

  .markdown-body pre code,
  .markdown-body pre tt {
    background: transparent;
  }

  .markdown-body code,
  .markdown-body tt {
    padding: 0.2em 0.45em;
    color: var(--lux-gold-light);
    background: rgba(216, 185, 120, 0.1);
    border: 1px solid rgba(216, 185, 120, 0.16);
    border-radius: 5px;
    font-family:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      Menlo,
      monospace;
    font-size: 0.9em;
  }

  .markdown-body pre code {
    color: var(--lux-text-soft);
    border: 0;
    font-size: 0.9rem;
    line-height: 1.7;
  }

  .markdown-body kbd {
    padding: 0.25em 0.55em;
    color: var(--lux-text);
    background: var(--lux-alt);
    border: 1px solid var(--lux-border);
    border-radius: 6px;
    box-shadow:
      inset 0 -2px 0 rgba(216, 185, 120, 0.24),
      0 2px 8px rgba(0, 0, 0, 0.2);
    font-family: inherit;
    font-size: 0.85em;
  }

  .markdown-body img {
    max-width: 100%;
    background: transparent;
    border-radius: var(--lux-radius-md);
    box-shadow: var(--lux-shadow);
  }

  .markdown-body .highlight .c,
  .markdown-body .highlight .c1,
  .markdown-body .highlight .cm,
  .markdown-body .highlight .cp,
  .markdown-body .highlight .cs {
    color: #8292a8;
  }

  .markdown-body .highlight .k,
  .markdown-body .highlight .kd,
  .markdown-body .highlight .kn,
  .markdown-body .highlight .kp,
  .markdown-body .highlight .kr,
  .markdown-body .highlight .kt,
  .markdown-body .highlight .o,
  .markdown-body .highlight .ow {
    color: #f29b9b;
  }

  .markdown-body .highlight .s,
  .markdown-body .highlight .s1,
  .markdown-body .highlight .s2,
  .markdown-body .highlight .sb,
  .markdown-body .highlight .sc,
  .markdown-body .highlight .sd,
  .markdown-body .highlight .se,
  .markdown-body .highlight .sh,
  .markdown-body .highlight .si,
  .markdown-body .highlight .sr,
  .markdown-body .highlight .ss {
    color: #b9dcff;
  }

  .markdown-body .highlight .m,
  .markdown-body .highlight .mf,
  .markdown-body .highlight .mh,
  .markdown-body .highlight .mi,
  .markdown-body .highlight .mo,
  .markdown-body .highlight .il,
  .markdown-body .highlight .nb,
  .markdown-body .highlight .nc,
  .markdown-body .highlight .no,
  .markdown-body .highlight .nv {
    color: #8bdbea;
  }

  .markdown-body .highlight .nf,
  .markdown-body .highlight .na,
  .markdown-body .highlight .nt {
    color: #d7b5ff;
  }

  .markdown-body .highlight .gd {
    color: #ffd3d0;
    background-color: rgba(119, 35, 49, 0.5);
  }

  .markdown-body .highlight .gi {
    color: #b9f5ca;
    background-color: rgba(28, 104, 69, 0.42);
  }

  .markdown-body .highlight .err {
    color: #ffd3d0;
    background-color: rgba(119, 35, 49, 0.5);
  }

  a:focus-visible,
  summary:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--lux-gold-light);
    outline-offset: 4px;
    border-radius: 4px;
  }

  ::selection {
    background-color: rgba(216, 185, 120, 0.32);
    color: #fff;
  }

  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  ::-webkit-scrollbar-track {
    background: var(--lux-bg);
  }

  ::-webkit-scrollbar-thumb {
    background: #34445b;
    border: 2px solid var(--lux-bg);
    border-radius: 999px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--lux-gold);
  }
</style>
